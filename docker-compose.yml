version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: support2docs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: support2docs
      POSTGRES_PASSWORD: support2docs
      POSTGRES_DB: support2docs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support2docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: support2docs_redis
    restart: unless-stopped
    # A02 — Require authentication to prevent unauthenticated access in
    # multi-tenant or cloud deployments. Default password is only for local dev;
    # override REDIS_PASSWORD in production via environment or secrets manager.
    command: redis-server --requirepass ${REDIS_PASSWORD:-support2docs_redis}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-support2docs_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-support2docs_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
