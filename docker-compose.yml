version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: support2docs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: support2docs
      POSTGRES_PASSWORD: support2docs
      POSTGRES_DB: support2docs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support2docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: support2docs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
